[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "job-copilot"
version = "1.0.0"
description = "Personal AI career assistant — apply to 10 roles intelligently, not 100 blindly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Salim Tagougui", email = "salim@salimtag.tech" }
]
keywords = ["ai", "job-search", "llm", "career", "rag", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.25.0",
    "google-genai>=1.0.0",
    "tavily-python>=0.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "sqlmodel>=0.0.16",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "pdfkit>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
job-copilot = "main:app"

[project.urls]
Homepage    = "https://salimtag.tech"
Repository  = "https://github.com/salimtag/job-copilot"
Portfolio   = "https://salimtag.tech/#projects"

[tool.setuptools.packages.find]
exclude = ["tests*", "demo*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source  = ["."]
omit    = ["tests/*", "demo/*", "*/migrations/*"]
